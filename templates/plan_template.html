<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f4ef;
    --surface: #ffffff;
    --surface-2: #f0ece4;
    --ink: #1b1a17;
    --ink-2: #4a473f;
    --muted: #757066;
    --line: #e2ddd2;
    --line-2: #d3ccbe;
    --accent: #1d6b4c;
    --accent-soft: #e6f0ea;
    --accent-ink: #14513a;
    --warn-bg: #fbf0e1;
    --warn-ink: #7f4a11;
    --warn-line: #ecd4ae;
    --bad-bg: #fbeae8;
    --bad-ink: #8c2e23;
    --bad-line: #eec8c2;
    --shadow: 0 1px 2px rgba(27,26,23,.05), 0 8px 24px -16px rgba(27,26,23,.25);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121210;
      --surface: #1a1a17;
      --surface-2: #222220;
      --ink: #eceae3;
      --ink-2: #c6c2b8;
      --muted: #969085;
      --line: #2e2d29;
      --line-2: #3b3a35;
      --accent: #74cfa4;
      --accent-soft: #17281f;
      --accent-ink: #9adcbd;
      --warn-bg: #2a2114;
      --warn-ink: #e5b478;
      --warn-line: #4a3a1f;
      --bad-bg: #2b1815;
      --bad-ink: #ef9f95;
      --bad-line: #4a2620;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-wrap: break-word;
  }
  .wrap {
    max-width: 44rem;
    margin: 0 auto;
    padding: 1.5rem 1rem 4rem;
  }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.015em; }
  p { margin: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
  a:hover { text-decoration-color: currentColor; }
  button { font: inherit; color: inherit; }

  .num { font-variant-numeric: tabular-nums; }
  .kicker {
    font-size: .6875rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .muted { color: var(--muted); }
  .small { font-size: .8125rem; }
  .tiny { font-size: .75rem; }

  /* ---------- masthead ---------- */
  .mast { margin-bottom: 1.5rem; }
  .brand {
    display: flex; align-items: baseline; gap: .5rem;
    margin-bottom: 1.25rem;
  }
  .brand .name {
    font-size: .8125rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
  }
  .brand .tag { font-size: .75rem; color: var(--muted); letter-spacing: .02em; }
  .route {
    font-size: clamp(1.75rem, 8vw, 2.5rem);
    line-height: 1.1;
    font-weight: 600;
    letter-spacing: -0.03em;
  }
  .route .arr { color: var(--muted); font-weight: 400; padding: 0 .1em; }
  .facts {
    display: flex; flex-wrap: wrap; gap: .375rem .75rem;
    margin-top: .75rem; font-size: .9375rem; color: var(--ink-2);
  }
  .facts .sep { color: var(--line-2); }
  .stamp { margin-top: .5rem; }

  /* ---------- generic card ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1rem;
    box-shadow: var(--shadow);
  }
  section { margin-top: 1.5rem; }
  .sec-head { margin-bottom: .625rem; }
  .sec-head h2 { font-size: 1.0625rem; }
  .sec-head .sub { margin-top: .125rem; font-size: .8125rem; color: var(--muted); }

  /* ---------- banners ---------- */
  .banner {
    border-radius: var(--radius);
    padding: .875rem 1rem;
    border: 1px solid var(--warn-line);
    background: var(--warn-bg);
    color: var(--warn-ink);
  }
  .banner.bad { border-color: var(--bad-line); background: var(--bad-bg); color: var(--bad-ink); }
  .banner h2 { font-size: .9375rem; }
  .banner ul { margin-top: .5rem; display: grid; gap: .5rem; }
  .banner li { font-size: .8125rem; line-height: 1.45; }
  .banner .step {
    font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .75rem;
  }

  /* ---------- assumptions ---------- */
  .assump { border-left: 3px solid var(--accent); }
  .assump ol { display: grid; gap: .75rem; }
  .assump li { display: flex; gap: .625rem; align-items: flex-start; }
  .assump .dot {
    flex: 0 0 auto; width: .4375rem; height: .4375rem; margin-top: .5rem;
    border-radius: 50%; background: var(--accent);
  }
  .assump .text { font-size: .9375rem; line-height: 1.45; }
  .assump .key {
    display: inline-block; margin-top: .1875rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .6875rem; color: var(--muted);
  }
  .reply-hint {
    margin-top: .875rem; padding-top: .75rem; border-top: 1px dashed var(--line-2);
    font-size: .8125rem; color: var(--ink-2);
  }

  /* ---------- options ---------- */
  .tabs { display: grid; gap: .5rem; }
  @media (min-width: 34rem) { .tabs { grid-template-columns: repeat(3, 1fr); } }
  .tab {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: .75rem .875rem; box-shadow: var(--shadow);
  }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab[aria-selected="true"] {
    border-color: var(--accent); background: var(--accent-soft);
  }
  .tab .axis { display: block; }
  .tab .lab { display: block; font-weight: 600; font-size: .9375rem; margin-top: .125rem; line-height: 1.3; }
  .tab .amt { display: block; margin-top: .375rem; font-size: 1.0625rem; font-weight: 600; letter-spacing: -.01em; }
  .tab[aria-selected="true"] .amt { color: var(--accent-ink); }

  .panel { margin-top: 1.25rem; }
  .panel[hidden] { display: none; }
  .opt-head h2 { font-size: 1.25rem; letter-spacing: -.02em; }
  .opt-head .why { margin-top: .375rem; color: var(--ink-2); font-size: .9375rem; }

  .lock {
    display: inline-flex; align-items: center; gap: .5rem;
    padding: .3125rem .625rem; border-radius: 999px;
    border: 1px solid var(--accent); color: var(--accent-ink);
    background: var(--accent-soft);
    font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  }

  /* ---------- hero total ---------- */
  .hero { margin-top: 1rem; text-align: left; }
  .hero .amount {
    font-size: clamp(2.25rem, 12vw, 3.25rem);
    line-height: 1; font-weight: 650; letter-spacing: -.035em;
    display: block; margin-top: .25rem;
  }
  .hero .pp { margin-top: .5rem; font-size: .9375rem; color: var(--ink-2); }
  .fit {
    display: inline-block; margin-top: .75rem;
    padding: .3125rem .625rem; border-radius: 999px; font-size: .8125rem; font-weight: 600;
    border: 1px solid var(--accent); color: var(--accent-ink); background: var(--accent-soft);
  }
  .fit.over { border-color: var(--bad-line); color: var(--bad-ink); background: var(--bad-bg); }
  .fit.none { border-color: var(--line-2); color: var(--muted); background: var(--surface-2); }

  /* ---------- cost rows ---------- */
  .rows { display: grid; }
  .row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    padding: .5rem 0; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .row .lab { font-size: .9375rem; color: var(--ink-2); }
  .row .val { font-weight: 600; text-align: right; }
  .row.total { border-top: 2px solid var(--line-2); border-bottom: 0; margin-top: .25rem; padding-top: .625rem; }
  .row.total .lab { color: var(--ink); font-weight: 600; }

  /* ---------- provenance ---------- */
  .fig { white-space: nowrap; }
  .fig .approx { color: var(--muted); font-weight: 400; padding-right: .1em; }
  .why-btn {
    -webkit-appearance: none; appearance: none; cursor: pointer;
    margin-left: .3125rem; padding: 0 .375rem;
    min-width: 1.375rem; height: 1.375rem; line-height: 1.25rem;
    border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface-2);
    color: var(--muted); font-size: .6875rem; font-weight: 700; letter-spacing: .04em;
    vertical-align: .05em;
  }
  .why-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .why-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .note {
    display: block; white-space: normal;
    margin: .4375rem 0 .125rem; padding: .5rem .625rem;
    border-left: 2px solid var(--line-2); background: var(--surface-2);
    border-radius: 0 8px 8px 0;
    font-size: .75rem; line-height: 1.45; color: var(--ink-2); font-weight: 400;
    text-align: left;
  }
  .note[hidden] { display: none; }
  .note .src { font-weight: 600; color: var(--ink); }
  .soft-tag { font-size: .75rem; color: var(--muted); font-style: italic; }
  .soft-tag .why-btn { font-style: normal; }

  /* ---------- base / travel_to ---------- */
  .block { margin-top: 1rem; }
  .block > .kicker { display: block; margin-bottom: .5rem; }
  .base-name { font-size: 1.0625rem; font-weight: 600; letter-spacing: -.01em; }
  .meta { display: flex; flex-wrap: wrap; gap: .25rem .625rem; margin-top: .375rem; font-size: .8125rem; color: var(--muted); }
  .tolls { margin-top: .625rem; display: grid; gap: .375rem; }
  .toll { display: flex; justify-content: space-between; gap: .75rem; font-size: .8125rem; }
  .toll .tname { color: var(--ink-2); }

  /* ---------- days ---------- */
  .day { margin-top: 1rem; }
  .day-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem; margin-bottom: .5rem; }
  .day-head h3 { font-size: 1.0625rem; }
  .badge {
    display: inline-block; padding: .1875rem .5rem; border-radius: 999px;
    border: 1px solid var(--line-2); background: var(--surface-2);
    font-size: .6875rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-2); white-space: nowrap;
  }
  .badge.foot { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .reason { font-size: .875rem; color: var(--ink-2); margin-bottom: .75rem; }
  .daystats { display: flex; flex-wrap: wrap; gap: .25rem .75rem; font-size: .8125rem; color: var(--muted); margin-bottom: .75rem; }

  .walk { margin: .75rem 0; padding: .625rem .75rem; border-radius: 10px; background: var(--surface-2); }
  .walk .top { display: flex; justify-content: space-between; gap: .75rem; font-size: .8125rem; }
  .walk .bar { margin-top: .4375rem; height: 5px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .walk .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .walk.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .walk.warn .bar { background: var(--warn-line); }
  .walk.warn .bar i { background: currentColor; }
  .walk .msg { margin-top: .4375rem; font-size: .75rem; line-height: 1.4; }

  .stop { display: flex; gap: .75rem; padding: .625rem 0; }
  .stop .when {
    flex: 0 0 3.5rem; font-size: .8125rem; line-height: 1.35; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .stop .when .dep { color: var(--muted); }
  .stop .body { min-width: 0; flex: 1 1 auto; }
  .stop .nm { font-weight: 600; font-size: .9375rem; line-height: 1.35; overflow-wrap: anywhere; }
  .stop .desc { margin-top: .25rem; font-size: .875rem; color: var(--ink-2); line-height: 1.45; }
  .stop .tags { display: flex; flex-wrap: wrap; gap: .25rem .5rem; margin-top: .375rem; font-size: .75rem; color: var(--muted); }
  .stop .tags .k {
    border: 1px solid var(--line); border-radius: 999px; padding: .0625rem .4375rem;
  }
  .leg {
    display: flex; gap: .75rem; align-items: center;
    font-size: .75rem; color: var(--muted);
  }
  .leg .rail { flex: 0 0 3.5rem; display: flex; justify-content: center; }
  .leg .rail span { display: block; width: 1px; height: 1.375rem; background: var(--line-2); }
  .leg .txt { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .5rem; }
  .notes { margin-top: .625rem; display: grid; gap: .375rem; }
  .notes li { font-size: .8125rem; color: var(--ink-2); padding-left: .875rem; position: relative; line-height: 1.45; }
  .notes li::before { content: ""; position: absolute; left: 0; top: .5rem; width: .375rem; height: 1px; background: var(--line-2); }

  /* ---------- constraints ---------- */
  .cons { display: grid; gap: .625rem; }
  .cons li { display: flex; gap: .625rem; align-items: flex-start; }
  .cons .kind {
    flex: 0 0 auto; margin-top: .0625rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .6875rem; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: .0625rem .3125rem;
  }
  .cons .ctext { font-size: .9375rem; line-height: 1.45; }

  .empty { color: var(--muted); font-size: .875rem; }

  /* ---------- footer ---------- */
  footer { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
  .legend { display: grid; gap: .5rem; margin-top: .625rem; }
  .legend li { font-size: .75rem; color: var(--muted); line-height: 1.45; }
  .legend b { color: var(--ink-2); font-weight: 600; }
  .langbar { margin-top: 1rem; }
  .langbtn {
    -webkit-appearance: none; appearance: none; cursor: pointer;
    background: none; border: 0; padding: .25rem 0;
    font-size: .75rem; color: var(--muted); text-decoration: underline;
    text-underline-offset: 3px;
  }
  .langbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- failure fallback ---------- */
  .fallback { border: 1px solid var(--bad-line); background: var(--bad-bg); color: var(--bad-ink); border-radius: var(--radius); padding: 1rem; }
  .fallback h1 { font-size: 1.125rem; }
  .fallback p { margin-top: .5rem; font-size: .875rem; line-height: 1.5; }
  .fallback pre {
    margin: .75rem 0 0; padding: .625rem; overflow-x: auto;
    background: var(--surface); border-radius: 8px; color: var(--ink-2);
    font-size: .6875rem; white-space: pre-wrap; word-break: break-word;
  }

  @media print {
    :root {
      --bg: #fff; --surface: #fff; --surface-2: #fff;
      --ink: #000; --ink-2: #222; --muted: #555;
      --line: #ccc; --line-2: #999;
      --accent: #000; --accent-ink: #000; --accent-soft: #fff;
      --warn-bg: #fff; --warn-ink: #000; --warn-line: #999;
      --bad-bg: #fff; --bad-ink: #000; --bad-line: #999;
      --shadow: none;
    }
    body { background: #fff; color: #000; font-size: 11pt; }
    .wrap { max-width: none; padding: 0; }
    .card, .tab, .banner { break-inside: avoid; }
    .why-btn, .langbar { display: none !important; }
    .note[hidden] { display: block !important; }
    .day, .stop, .hero, .rows { break-inside: avoid; }
    section { margin-top: 1rem; }
    a { text-decoration: none; }
  }
</style>
</head>

    if (!d) return str(s) || T("unknown");
    try { return new Intl.DateTimeFormat(lang, opts).format(d); } catch (e) { return str(s); }
  }
  function longDate(s) { return fmtDate(s, { weekday: "short", day: "numeric", month: "long" }); }
  function shortDate(s) { return fmtDate(s, { day: "numeric", month: "short" }); }
  function stamp(iso) {
    var d = new Date(str(iso));
    if (isNaN(d.getTime())) return str(iso);
    try {
      return new Intl.DateTimeFormat(lang, {
        day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
      }).format(d);
    } catch (e) { return str(iso); }
  }
  function asOfText(v) {
    var s = str(v);
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return fmtDate(s, { day: "numeric", month: "short", year: "numeric" });
    return s;
  }
  function nightsBetween(a, b) {
    var A = parseDate(a), B = parseDate(b);
    if (!A || !B) return null;
    var n = Math.round((B.getTime() - A.getTime()) / 86400000);
    return n >= 1 ? n : 1;
  }
  function safeUrl(u) {
    var s = str(u).trim();
    return /^https?:\/\//i.test(s) ? s : "";
  }
  function link(url, text, cls) {
    var href = safeUrl(url);
    if (!href) return null;
    var a = el("a", cls || null, text);
    a.href = href;
    a.rel = "noopener noreferrer nofollow";
    a.target = "_blank";
    return a;
  }

  /* ============================== provenance ==============================
     Only "measured" prints as a plain number. Everything else prints with a
     leading ≈ and a tappable note that says where the number came from. */

  var whySeq = 0;

  function isSoftSource(src) {
    var s = str(src).toLowerCase();
    return s !== "" && s !== "measured";
  }

  function noteText(prov, extra) {
    var p = obj(prov);
    var src = str(p.source).toLowerCase() || "estimated";
    var bits = [];
    var explain = T("sourceExplain." + src);
    if (explain) bits.push(explain);
    if (has(p.detail)) bits.push(str(p.detail));
    if (has(extra)) bits.push(str(extra));
    if (has(p.as_of)) bits.push(T("asOf", asOfText(p.as_of)));
    return { label: T("source." + src) || src, body: bits.join(" ") };
  }

  /* Returns a <span> with the value, the ≈ when soft, and an expandable note. */
  function figure(text, prov, opts) {
    opts = opts || {};
    var p = obj(prov);
    var soft = opts.forceSoft === true || isSoftSource(p.source);
    var wrap = el("span", "fig");

    if (soft && opts.noApprox !== true) add(wrap, el("span", "approx", APPROX));
    if (has(text)) add(wrap, el("span", null, text));

    if (!soft) return wrap;

    var parts = noteText(p, opts.extra);
    var note = el("span", "note");
    add(note, el("b", "src", parts.label + (parts.body ? ": " : "")));
    if (parts.body) add(note, document.createTextNode(parts.body));
    note.hidden = true;
    note.id = "n" + (++whySeq);

    var btn = el("button", "why-btn", T("whyBtn"));
    btn.type = "button";
    btn.setAttribute("aria-expanded", "false");
    btn.setAttribute("aria-controls", note.id);
    btn.setAttribute("aria-label", T("whyBtnTitle"));
    btn.title = T("whyBtnTitle");
    btn.addEventListener("click", function (ev) {
      ev.stopPropagation();
      ev.preventDefault();
      var open = note.hidden;
      note.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    });

    add(wrap, btn, note);
    return wrap;
  }

  /* ============================== sections ============================== */

  function renderMast(state) {
    var intake = obj(state.intake);
    var head = el("header", "mast");

    var brand = el("div", "brand");
    add(brand, el("span", "name", T("brand")), el("span", "tag", T("tagline")));
    add(head, brand);

    var h1 = el("h1", "route");
    add(h1, el("span", null, has(intake.origin) ? str(intake.origin) : T("unknown")));
    add(h1, el("span", "arr", " " + T("arrow") + " "));
    add(h1, el("span", null, has(intake.region) ? str(intake.region) : T("unknown")));
    add(head, h1);

    var facts = el("div", "facts");
    var pieces = [];

    var n = nightsBetween(intake.start_date, intake.end_date);
    if (has(intake.start_date) || has(intake.end_date)) {
      var range = shortDate(intake.start_date) + " " + T("arrow") + " " + shortDate(intake.end_date);
      pieces.push(range + (n ? " " + MID + " " + T("nights", n) : ""));
    }
    var party = parseInt(intake.party_size, 10);
    if (isFinite(party) && party > 0) pieces.push(T("people", party));
    var budget = num(intake.budget_total_brl);
    pieces.push(budget > 0 ? T("budgetCeiling", money(budget)) : T("noBudget"));

    pieces.forEach(function (p, i) {
      if (i) add(facts, el("span", "sep", MID));
      add(facts, el("span", null, p));
    });
    add(head, facts);

    if (has(state.updated_at)) {
      add(head, el("p", "kicker stamp", T("updatedAt", stamp(state.updated_at))));
    }
    return head;
  }

  function renderDiagnostics(state) {
    var bad = arr(state.diagnostics).filter(function (d) {
      var s = str(obj(d).status).toLowerCase();
      return s === "failed" || s === "degraded";
    });
    if (!bad.length) return null;

    var anyFailed = bad.some(function (d) { return str(obj(d).status).toLowerCase() === "failed"; });
    var box = el("div", "banner" + (anyFailed ? " bad" : ""));
    box.setAttribute("role", anyFailed ? "alert" : "status");
    add(box, el("h2", null, anyFailed ? T("diagTitleFailed") : T("diagTitleDegraded")));
    add(box, el("p", "small", anyFailed ? T("diagSubFailed") : T("diagSubDegraded")));

    var ul = el("ul");
    bad.forEach(function (d) {
      d = obj(d);
      var li = el("li");
      add(li, el("span", "step", str(d.step) || "?"));
      add(li, document.createTextNode(" " + MID + " "));
      add(li, document.createTextNode(str(d.status).toLowerCase()));
      if (has(d.detail)) {
        add(li, el("br"));
        add(li, document.createTextNode(str(d.detail)));
      }
      add(ul, li);
    });
    add(box, ul);

    var sec = el("section");
    add(sec, box);
    return sec;
  }

  function renderAssumptions(state) {
    var list = arr(state.assumptions).filter(function (a) { return has(obj(a).text) || has(obj(a).key); });
    if (!list.length) return null;

    var sec = el("section");
    var head = el("div", "sec-head");
    add(head, el("h2", null, T("assumptionsTitle")));
    add(head, el("p", "sub", T("assumptionsSub")));
    add(sec, head);

    var card = el("div", "card assump");
    var ol = el("ol");
    list.forEach(function (a) {
      a = obj(a);
      var li = el("li");
      add(li, el("span", "dot"));
      var body = el("span");
      add(body, el("span", "text", has(a.text) ? str(a.text) : str(a.key) + ": " + str(a.value)));
      if (has(a.key)) {
        var k = el("span", "key", str(a.key) + (has(a.value) ? " = " + str(a.value) : ""));
        add(body, el("br"), k);
      }
      add(li, body);
      add(ol, li);
    });
    add(card, ol);
    add(card, el("p", "reply-hint", T("replyHint")));
    add(sec, card);
    return sec;
  }

  /* ---------- costs ---------- */

  var COST_KEYS = ["lodging_brl", "travel_to_brl", "travel_within_brl", "food_brl"];

  function softKeys(costs) {
    var raw = arr(costs.estimated_items).map(function (s) {
      return str(s).toLowerCase().trim().replace(/_brl$/, "");
    });
    return raw;
  }
  function isSoftLine(costs, key) {
    var bare = key.toLowerCase().replace(/_brl$/, "");
    return softKeys(costs).indexOf(bare) !== -1;
  }
  function softLineNames(costs) {
    var names = softKeys(costs).map(function (bare) {
      return T("cost." + bare + "_brl") || bare;
    });
    return names.join(", ");
  }

  function renderHero(option) {
    var costs = obj(option.costs);
    var anySoft = softKeys(costs).length > 0;
    var box = el("div", "hero");

    add(box, el("span", "kicker", T("totalTitle")));

    var amount = el("span", "amount num");
    add(amount, figure(money(costs.total_brl), null, {
      forceSoft: anySoft,
      extra: anySoft ? T("softTotal", softLineNames(costs)) : ""
    }));
    add(box, amount);

    var pp = num(costs.per_person_brl);
    if (pp > 0) add(box, el("p", "pp num", T("perPerson", money(pp))));

    var budget = num(costs.budget_brl);
    if (budget > 0) {
      var diff = budget - num(costs.total_brl);
      var over = costs.within_budget === false || diff < 0;
      var chip = el("span", "fit" + (over ? " over" : ""),
        over ? T("overBudget", money(Math.abs(diff))) : T("withinBudget", money(Math.abs(diff))));
      add(box, chip);
    } else {
      add(box, el("span", "fit none", T("budgetUnset")));
    }
    return box;
  }

  function renderCosts(option) {
    var costs = obj(option.costs);
    var block = el("div", "block");
    add(block, el("span", "kicker", T("costTitle")));

    var rows = el("div", "rows");
    COST_KEYS.forEach(function (key) {
      /* Every line always prints, zero included: a zero is information here. */
      var v = num(costs[key]);
      var row = el("div", "row");
      add(row, el("span", "lab", T("cost." + key) || key));
      var val = el("span", "val num");
      add(val, figure(money(v), null, {
        forceSoft: isSoftLine(costs, key),
        extra: T("softCost")
      }));
      add(row, val);
      add(rows, row);
    });

    var total = el("div", "row total");
    add(total, el("span", "lab", T("cost.total_brl")));
    var tv = el("span", "val num");
    add(tv, figure(money(costs.total_brl), null, { forceSoft: softKeys(costs).length > 0 }));
    add(total, tv);
    add(rows, total);

    add(block, rows);
    return block;
  }

  /* ---------- base + drive ---------- */

  function renderBase(option) {
    var base = obj(option.base);
    if (!has(base.name) && num(base.total_price_brl) === 0) return null;

    var block = el("div", "block");
    add(block, el("span", "kicker", T("baseTitle")));
    add(block, el("p", "base-name", has(base.name) ? str(base.name) : T("unknown")));

    var meta = el("div", "meta");
    var bits = [];
    if (has(base.city)) bits.push(el("span", null, str(base.city)));
    if (num(base.rating) > 0) bits.push(el("span", "num", T("rating", dec(base.rating, 2))));
    if (num(base.capacity) > 0) bits.push(el("span", null, T("capacity", Math.round(num(base.capacity)))));
    if (base.has_kitchen === true) bits.push(el("span", null, T("kitchen")));
    var a = link(base.url, T("openListing"));
    if (a) bits.push(a);
    bits.forEach(function (b, i) {
      if (i) add(meta, el("span", "sep", MID));
      add(meta, b);
    });
    if (bits.length) add(block, meta);

    var rows = el("div", "rows");
    if (num(base.price_per_night_brl) > 0) {
      var r1 = el("div", "row");
      add(r1, el("span", "lab", T("perNightLabel")));
      var v1 = el("span", "val num");
      add(v1, figure(money(base.price_per_night_brl), base.provenance));
      add(r1, v1);
      add(rows, r1);
    }
    var r2 = el("div", "row");
    add(r2, el("span", "lab", T("lodgingTotalLabel")));
    var v2 = el("span", "val num");
    add(v2, figure(money(base.total_price_brl), base.provenance));
    add(r2, v2);
    add(rows, r2);
    add(block, rows);

    return block;
  }

  function renderTravelTo(option) {
    var t = obj(option.travel_to);
    if (num(t.distance_km) === 0 && num(t.total_cost_brl) === 0) return null;

    var block = el("div", "block");
    add(block, el("span", "kicker", T("travelToTitle")));

    var head = el("div", "day-head");
    add(head, el("span", "badge", T("mode." + str(t.mode).toLowerCase()) || str(t.mode)));
    add(head, el("span", "small muted", t.round_trip === false ? T("oneWay") : T("roundTrip")));
    add(block, head);

    var stats = el("div", "daystats num");
    var s = [];
    if (num(t.distance_km) > 0) s.push(km(t.distance_km));
    if (num(t.duration_min) > 0) s.push(dur(t.duration_min));
    if (num(t.liters) > 0) s.push(T("liters", dec(t.liters, 2)));
    s.forEach(function (x, i) {
      if (i) add(stats, el("span", "sep", MID));
      add(stats, el("span", null, x));
    });
    if (s.length) add(block, stats);

    var rows = el("div", "rows");
    if (num(t.fuel_cost_brl) > 0) {
      var rf = el("div", "row");
      add(rf, el("span", "lab", T("fuel")));
      var vf = el("span", "val num");
      add(vf, figure(money(t.fuel_cost_brl), t.provenance));
      add(rf, vf);
      add(rows, rf);
    }
    if (num(t.toll_cost_brl) > 0) {
      var rt = el("div", "row");
      add(rt, el("span", "lab", T("tollsTitle")));
      var vt = el("span", "val num");
      add(vt, figure(money(t.toll_cost_brl), { source: "curated", detail: "", as_of: str(obj(t.provenance).as_of) }));
      add(rt, vt);
      add(rows, rt);
    }
    var rtot = el("div", "row total");
    add(rtot, el("span", "lab", T("cost.travel_to_brl")));
    var vtot = el("span", "val num");
    add(vtot, figure(money(t.total_cost_brl), t.provenance));
    add(rtot, vtot);
    add(rows, rtot);
    add(block, rows);

    var tolls = arr(t.tolls);
    if (tolls.length) {
      var list = el("div", "tolls");
      tolls.forEach(function (x) {
        x = obj(x);
        var row = el("div", "toll");
        var left = el("span", "tname");
        add(left, document.createTextNode(has(x.name) ? str(x.name) : T("tollsTitle")));
        var sub = [];
        if (has(x.road)) sub.push(str(x.road));
        if (has(x.operator)) sub.push(str(x.operator));
        if (sub.length) add(left, el("span", "muted", " " + MID + " " + sub.join(" " + MID + " ")));
        var check = link(x.verify_url, T("verifyToll"), "tiny");
        if (check) { add(left, document.createTextNode(" ")); add(left, check); }
        add(row, left, el("span", "num", money(x.price_brl)));
        add(list, row);
      });
      add(block, list);
    }
    return block;
  }

  /* ---------- days ---------- */

  function renderWalking(day) {
    var walked = num(day.walking_km);
    if (walked <= 0) return null;
    var over = walked > WALK_LIMIT_KM;
    var box = el("div", "walk" + (over ? " warn" : ""));

    var top = el("div", "top");
    add(top, el("span", null, T("walkTitle")));
    add(top, el("span", "num", km(walked)));
    add(box, top);

    var bar = el("div", "bar");
    var fill = el("i");
    var pct = Math.max(2, Math.min(100, (walked / WALK_LIMIT_KM) * 100));
    fill.style.width = pct + "%";
    add(bar, fill);
    add(box, bar);

    add(box, el("p", "msg", over ? T("walkWarn", km(WALK_LIMIT_KM)) : T("walkLimit", km(WALK_LIMIT_KM))));
    return box;
  }

  function renderStop(stop) {
    stop = obj(stop);
    var row = el("div", "stop");

    var when = el("div", "when num");
    if (has(stop.arrive)) add(when, el("div", null, str(stop.arrive)));
    if (has(stop.depart)) add(when, el("div", "dep", str(stop.depart)));
    if (!has(stop.arrive) && !has(stop.depart)) add(when, el("div", "dep", T("unknown")));
    add(row, when);

    var body = el("div", "body");
    add(body, el("p", "nm", has(stop.name) ? str(stop.name) : T("unknown")));
    if (has(stop.description)) add(body, el("p", "desc", str(stop.description)));

    var tags = el("div", "tags");
    var items = [];
    var kindLabel = T("kind." + str(stop.kind).toLowerCase());
    if (kindLabel) items.push(el("span", "k", kindLabel));
    if (has(stop.category)) items.push(el("span", "k", str(stop.category)));
    if (num(stop.dwell_min) > 0) items.push(el("span", null, T("dwell", dur(stop.dwell_min))));
    if (has(stop.opening_hours)) items.push(el("span", null, T("hours", str(stop.opening_hours))));
    var a = link(stop.url, T("openPoi"));
    if (a) items.push(a);
    items.forEach(function (x) { add(tags, x); });

    var prov = obj(stop.provenance);
    if (isSoftSource(prov.source)) {
      var mark = figure(T("source." + str(prov.source).toLowerCase()) || str(prov.source), prov, { noApprox: true });
      mark.className = "fig soft-tag";
      add(tags, mark);
    }
    if (items.length || isSoftSource(prov.source)) add(body, tags);

    add(row, body);
    return row;
  }

  function renderLeg(leg) {
    leg = obj(leg);
    var row = el("div", "leg");
    var rail = el("div", "rail");
    add(rail, el("span"));
    add(row, rail);

    var txt = el("div", "txt");
    var modeLabel = T("mode." + str(leg.mode).toLowerCase()) || str(leg.mode);
    if (modeLabel) add(txt, el("span", null, modeLabel));

    var prov = obj(leg.provenance);
    var pieces = [];
    if (num(leg.distance_km) > 0) pieces.push(km(leg.distance_km));
    if (num(leg.duration_min) > 0) pieces.push(dur(leg.duration_min));
    if (pieces.length) {
      var span = el("span", "num");
      add(span, figure(pieces.join(" " + MID + " "), prov));
      add(txt, span);
    }
    if (num(leg.cost_brl) > 0) {
      var c = el("span", "num");
      add(c, figure(money(leg.cost_brl), prov));
      add(txt, c);
    }
    add(row, txt);
    return row;
  }

  function renderDay(day, index) {
    day = obj(day);
    var box = el("article", "card day");

    var head = el("div", "day-head");
    var title = el("h3", null, has(day.date) ? longDate(day.date) : T("dayNo", index + 1));
    add(head, title);
    var mode = str(day.travel_within).toLowerCase();
    var badge = el("span", "badge" + (mode === "foot" ? " foot" : ""), T("mode." + mode) || mode || T("unknown"));
    add(head, badge);
    add(box, head);

    if (has(day.mode_reason)) add(box, el("p", "reason", str(day.mode_reason)));

    var stats = el("div", "daystats num");
    var s = [];
    var stops = arr(day.stops);
    if (stops.length) s.push(T("stopsCount", stops.length));
    if (num(day.spread_km) > 0) s.push(T("spread", km(day.spread_km)));
    if (num(day.distance_km) > 0) s.push(T("dayDistance", km(day.distance_km)));
    if (num(day.travel_duration_min) > 0) s.push(T("dayDuration", dur(day.travel_duration_min)));
    if (num(day.travel_cost_brl) > 0) s.push(T("dayCost", money(day.travel_cost_brl)));
    s.forEach(function (x, i) {
      if (i) add(stats, el("span", "sep", MID));
      add(stats, el("span", null, x));
    });
    if (s.length) add(box, stats);

    var walk = renderWalking(day);
    if (walk) add(box, walk);

    var legs = arr(day.legs);
    var byPair = {};
    legs.forEach(function (lg) {
      var k = str(obj(lg).from_id) + ">" + str(obj(lg).to_id);
      if (!byPair[k]) byPair[k] = lg;
    });

    if (!stops.length) {
      add(box, el("p", "empty", T("noDays")));
    } else {
      var used = {};
      stops.forEach(function (stop, i) {
        add(box, renderStop(stop));
        if (i < stops.length - 1) {
          var key = str(obj(stop).id) + ">" + str(obj(stops[i + 1]).id);
          var lg = byPair[key];
          if (!lg && legs[i] && !used[i]) { lg = legs[i]; used[i] = true; }
          if (lg) add(box, renderLeg(lg));
        }
      });
    }

    var notes = arr(day.notes).filter(has);
    if (notes.length) {
      var ul = el("ul", "notes");
      notes.forEach(function (n) { add(ul, el("li", null, str(n))); });
      add(box, ul);
    }
    return box;
  }

  /* ---------- one option ---------- */

  function optionTotalNode(option) {
    var costs = obj(option.costs);
    var soft = softKeys(costs).length > 0;
    var span = el("span", "num");
    if (soft) add(span, el("span", "approx", APPROX));
    add(span, document.createTextNode(money(costs.total_brl)));
    return span;
  }

  function renderOptionPanel(option, locked) {
    var panel = el("div", "panel");
    panel.setAttribute("role", "tabpanel");

    var head = el("div", "opt-head");
    var axis = T("axis." + str(option.axis).toLowerCase());
    if (locked) {
      add(head, el("span", "lock", T("lockedBadge")));
    } else if (axis) {
      add(head, el("p", "kicker", axis));
    }
    add(head, el("h2", null, has(option.label) ? str(option.label) : (axis || T("unknown"))));
    if (has(option.why)) add(head, el("p", "why", str(option.why)));
    if (locked) add(head, el("p", "small muted", T("lockedSub")));
    add(panel, head);

    var money_card = el("div", "card block");
    add(money_card, renderHero(option));
    add(money_card, renderCosts(option));
    var base = renderBase(option);
    if (base) add(money_card, base);
    var drive = renderTravelTo(option);
    if (drive) add(money_card, drive);
    add(panel, money_card);

    var days = arr(option.days);
    var daysSec = el("section");
    var dh = el("div", "sec-head");
    add(dh, el("h2", null, T("daysTitle")));
    add(daysSec, dh);
    if (!days.length) {
      var empty = el("div", "card");
      add(empty, el("p", "empty", T("noDays")));
      add(daysSec, empty);
    } else {
      days.forEach(function (d, i) { add(daysSec, renderDay(d, i)); });
    }
    add(panel, daysSec);

    return panel;
  }

  function renderOptions(state) {
    var all = arr(state.options).filter(function (o) { return o && typeof o === "object"; });
    var sec = el("section");

    if (!all.length) {
      var head0 = el("div", "sec-head");
      add(head0, el("h2", null, T("optionsTitle", 0)));
      add(sec, head0);
      var card = el("div", "card");
      add(card, el("p", "empty", T("noOptions")));
      add(sec, card);
      return sec;
    }

    var selectedId = str(state.selected_option_id).trim();
    var locked = null;
    if (selectedId) {
      for (var i = 0; i < all.length; i++) {
        if (str(all[i].id) === selectedId) { locked = all[i]; break; }
      }
    }

    var head = el("div", "sec-head");
    if (locked) {
      add(head, el("h2", null, T("lockedTitle")));
    } else {
      add(head, el("h2", null, T("optionsTitle", all.length)));
      add(head, el("p", "sub", T("optionsSub")));
    }
    add(sec, head);

    if (locked) {
      add(sec, renderOptionPanel(locked, true));
      return sec;
    }

    var tabs = el("div", "tabs");
    tabs.setAttribute("role", "tablist");
    var panels = [];
    var buttons = [];

    all.forEach(function (option, i) {
      var id = "opt" + i;
      var btn = el("button", "tab");
      btn.type = "button";
      btn.id = "tab-" + id;
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-controls", "panel-" + id);
      btn.setAttribute("aria-selected", i === 0 ? "true" : "false");
      btn.tabIndex = i === 0 ? 0 : -1;

      var axis = T("axis." + str(option.axis).toLowerCase());
      add(btn, el("span", "kicker axis", axis || " "));
      add(btn, el("span", "lab", has(option.label) ? str(option.label) : (axis || T("unknown"))));
      var amt = el("span", "amt");
      add(amt, optionTotalNode(option));
      add(btn, amt);

      var panel = renderOptionPanel(option, false);
      panel.id = "panel-" + id;
      panel.setAttribute("aria-labelledby", "tab-" + id);
      panel.hidden = i !== 0;

      function select() {
        buttons.forEach(function (b, j) {
          b.setAttribute("aria-selected", j === i ? "true" : "false");
          b.tabIndex = j === i ? 0 : -1;
        });
        panels.forEach(function (p, j) { p.hidden = j !== i; });
      }
      btn.addEventListener("click", select);
      btn.addEventListener("keydown", function (ev) {
        var d = ev.key === "ArrowRight" || ev.key === "ArrowDown" ? 1
              : ev.key === "ArrowLeft" || ev.key === "ArrowUp" ? -1 : 0;
        if (!d) return;
        ev.preventDefault();
        var next = buttons[(i + d + buttons.length) % buttons.length];
        if (next) { next.focus(); next.click(); }
      });

      buttons.push(btn);
      panels.push(panel);
      add(tabs, btn);
    });

    add(sec, tabs);
    panels.forEach(function (p) { add(sec, p); });
    return sec;
  }

  /* ---------- constraints, footer ---------- */

  function renderConstraints(state) {
    var list = arr(state.constraints).filter(function (c) { return has(obj(c).text) || has(obj(c).value); });
    var sec = el("section");
    var head = el("div", "sec-head");
    add(head, el("h2", null, T("constraintsTitle")));
    add(head, el("p", "sub", T("constraintsSub")));
    add(sec, head);

    var card = el("div", "card");
    if (!list.length) {
      add(card, el("p", "empty", T("noConstraints")));
    } else {
      var ul = el("ul", "cons");
      list.forEach(function (c) {
        c = obj(c);
        var li = el("li");
        add(li, el("span", "kind", has(c.kind) ? str(c.kind) : "note"));
        var body = el("span");
        add(body, el("span", "ctext", has(c.text) ? str(c.text) : str(c.value)));
        add(li, body);
        add(ul, li);
      });
      add(card, ul);
    }
    add(sec, card);
    return sec;
  }

  function renderFooter(state) {
    var f = el("footer");
    add(f, el("p", "kicker", T("legendTitle")));

    var ul = el("ul", "legend");
    ["measured", "estimated", "curated"].forEach(function (src) {
      var li = el("li");
      add(li, el("b", null, (src === "measured" ? "" : APPROX + " ") + T("source." + src) + " "));
      add(li, document.createTextNode(T("sourceExplain." + src)));
      add(ul, li);
    });
    var li2 = el("li", null, T("legendApprox", T("source.estimated") + " / " + T("source.curated")));
    add(ul, li2);
    add(f, ul);

    add(f, el("p", "tiny muted", T("footerNote")));

    var bar = el("div", "langbar");
    var btn = el("button", "langbtn", T("switchLang"));
    btn.type = "button";
    btn.addEventListener("click", function () {
      lang = (lang === "pt-BR") ? "en" : "pt-BR";
      draw(state);
    });
    add(bar, btn);
    add(f, bar);
    return f;
  }

  /* ============================== bootstrap ============================== */

  function draw(state) {
    var root = document.getElementById("app");
    if (!root) return;
    root.textContent = "";

    document.documentElement.lang = lang;
    var intake = obj(state.intake);
    var title = [str(intake.origin), str(intake.region)].filter(has).join(" " + T("arrow") + " ");
    document.title = (title ? title + " " + MID + " " : "") + T("brand");

    add(root, renderMast(state));

    var diag = renderDiagnostics(state);
    if (diag) add(root, diag);

    var assum = renderAssumptions(state);
    if (assum) add(root, assum);

    add(root, renderOptions(state));
    add(root, renderConstraints(state));
    add(root, renderFooter(state));
  }

  function fallback(message, detail) {
    var root = document.getElementById("app");
    if (!root) return;
    root.textContent = "";
    var box = el("div", "fallback");
    add(box, el("h1", null, T("errTitle")));
    add(box, el("p", null, message || T("errBody")));
    if (detail) add(box, el("pre", null, String(detail).slice(0, 600)));
    add(root, box);
  }

  function boot() {
    var node = document.getElementById("plan");
    var state = null;
    try {
      if (!node) throw new Error("missing #plan block");
      state = JSON.parse(node.textContent || "{}");
      if (!state || typeof state !== "object" || Array.isArray(state)) {
        throw new Error("plan block is not an object");
      }
    } catch (err) {
      lang = "pt-BR";
      fallback(T("errBody"), err && err.message);
      return;
    }

    var want = str(state.lang).trim();
    lang = LABELS[want] ? want : "pt-BR";

    try {
      draw(state);
    } catch (err) {
      try {
        fallback(T("renderErr"), err && err.message);
      } catch (e2) {
        var root = document.getElementById("app");
        if (root) root.textContent = "MATE";
      }
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
